[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-short-factory"
version = "0.1.0"
description = "AI Short Factory — local-first short-video production application (Phase 1)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [ { name = "AI Short Factory Contributors" } ]

# Runtime dependencies are declared in requirements.txt for development; keep project deps minimal here.
dependencies = [
    "SQLAlchemy>=1.4",
]
